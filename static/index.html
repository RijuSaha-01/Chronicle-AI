<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle AI - Your Life, Episodic</title>
    <meta name="description" content="Transform your daily diary into cinematic episodes with AI-powered narratives.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- TOP NAVIGATION -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo & Brand -->
            <div class="brand">
                <div class="brand-text">
                    <span class="brand-name">Chronicle AI</span>
                    <span class="brand-tagline">Your Life, Episodic</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="nav-search">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="header-search" placeholder="Search memories..." autocomplete="off">
                    <span class="search-shortcut">/</span>
                </div>
                <div id="search-live-results" class="search-dropdown"></div>
            </div>

            <!-- Nav Links -->
            <div class="nav-links">
                <button class="nav-link active" data-view="episodes">
                    <span class="nav-link-icon">📺</span>
                    <span>Browse</span>
                </button>
                <button class="nav-link" data-view="create">
                    <span class="nav-link-icon">✍️</span>
                    <span>Create</span>
                </button>
            </div>

            <!-- AI Status -->
            <div class="nav-status">
                <div id="ai-status" class="status-indicator checking">
                    <span class="status-dot"></span>
                    <span class="status-label">AI</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="app-main" id="app-root">
        <!-- Views will be injected here by app.js -->
        <div class="empty-state">
            <h3>Initializing Hollywood...</h3>
        </div>
    </main>

    <!-- MODAL: EPISODE DETAIL -->
    <div id="modal-episode" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" />
                </svg>
            </button>
            <div id="modal-body">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <!-- AUDIO PLAYER ROOT -->
    <div id="audio-player-root"></div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <script type="module" src="/static/js/app.js"></script>
</body>

</html>
